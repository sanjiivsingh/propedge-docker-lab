<!doctype html>
<html>
<head><meta charset="utf-8"><title>PropEdge Trading Simulator</title>
<style>
body{font-family:Arial;background:#0b1020;color:#e8edf7;max-width:900px;margin:40px auto;padding:20px}
.card{background:#111a2d;border:1px solid #263451;border-radius:14px;padding:25px;margin-bottom:18px}
button{padding:12px 16px;margin:5px;border:0;border-radius:8px;color:white;background:#2f7cff;cursor:pointer}
.win{background:#159957}.loss{background:#d6455d}pre{background:#080d18;padding:18px}
</style></head>
<body>
<h1>Trading Simulator</h1>
<p>Generate trades for the ingestion pipeline. This application does not write directly to PostgreSQL.</p>
<div class="card">
<button onclick="generate('/trading/api/generate/random')">
    Random Trade
</button>

<button class="win" onclick="generate('/trading/api/generate/win')">
    Winning Trade
</button>

<button class="loss" onclick="generate('/trading/api/generate/loss')">
    Losing Trade
</button>
</div>
<div class="card"><h3>Last Generated Trade</h3><pre id="out">None</pre></div>
<div class="card"><h3>Flow</h3><p>Trading Simulator → HTTP API → Ingestion Service → PostgreSQL</p></div>
<script>
async function generate(url){
 const r=await fetch(url,{method:"POST"});
 out.textContent=JSON.stringify(await r.json(),null,2);
}
</script>
</body></html>
